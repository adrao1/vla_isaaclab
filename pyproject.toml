[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "isaac-simlab"
version = "0.1.0"
description = "Composable Isaac Lab simulation framework for shared lab workflows"
requires-python = ">=3.10"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["isaac_simlab*"]
